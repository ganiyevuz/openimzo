[workspace]
resolver = "2"
members = [
    "crates/eimzo-crypto",
    "crates/eimzo-pki",
    "crates/eimzo-cli",
    "crates/eimzo-keys",
    "crates/eimzo-rpc",
    "crates/eimzo-server",
    "crates/eimzo-ffi",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
der = { version = "0.7", features = ["alloc", "derive", "oid", "pem", "std"] }
spki = { version = "0.7", features = ["alloc", "std"] }
pkcs8 = { version = "0.10", features = ["alloc", "std"] }
x509-cert = { version = "0.2", features = ["pem", "std"] }
cms = { version = "0.2" }
pkcs12 = { version = "0.1", features = ["kdf"] }
pkcs5 = { version = "0.7", features = ["alloc", "pbes2"] }
const-oid = { version = "0.9", features = ["db"] }
num-bigint = "0.4"
# Fixed-width, constant-time-oriented big integers. Only `eimzo-crypto`'s `ec`
# module needs them, for the scalar arithmetic that carries the nonce and the
# private key; `num-bigint` stays for everything else in the workspace.
crypto-bigint = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
# Already compiled into the graph transitively via crypto-bigint; declared directly
# here so `eimzo-pki` can do constant-time equality on secret-derived MACs and digest
# checks without a version its own resolution could ever disagree with.
subtle = "2"
num-traits = "0.2"
num-integer = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
des = "0.8"
rc2 = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
aes = "0.8"
ecb = { version = "0.1", features = ["alloc", "block-padding"] }
rsa = "0.9"
if-addrs = "0.13"
hostname = "0.4"
hex = "0.4"
base64 = "0.22"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "signal"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2"] }
parking_lot = "0.12"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
axum = { version = "0.7", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower = "0.5"
# `default-features = false` here matters: tokio-rustls's own default pulls
# in `aws-lc-rs` (its "aws_lc_rs" feature), and Cargo unions every crate's
# requested features for a shared dependency, so that default would compile
# a second crypto backend into the whole graph alongside the `ring` this
# workspace asks for everywhere else. `rustls.workspace`'s `ring` feature
# below covers what this crate needs `rustls`'s protocol code to have; `ring`
# here on `tokio-rustls` itself keeps the two declarations symmetric against
# a future upgrade quietly reintroducing the same default.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rcgen = "0.13"
time = "0.3"
mime_guess = "2"
uniffi = { version = "0.28", features = ["tokio"] }
