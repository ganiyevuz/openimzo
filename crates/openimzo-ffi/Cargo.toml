[package]
name = "openimzo-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The UniFFI facade the macOS shell calls"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "openimzo_ffi"

[dependencies]
openimzo-crypto = { path = "../openimzo-crypto" }
openimzo-pki = { path = "../openimzo-pki" }
openimzo-keys = { path = "../openimzo-keys" }
openimzo-rpc = { path = "../openimzo-rpc" }
openimzo-server = { path = "../openimzo-server" }
uniffi = { workspace = true, features = ["cli"] }
tokio.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
zeroize.workspace = true
rand.workspace = true
rand_core.workspace = true
chrono.workspace = true
hex.workspace = true

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
