<!DOCTYPE html>
<html lang="{{lang}}">
    <head>
        <meta charset="UTF-8">
        <title>OpenImzo — API · {{version}}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="favicon.ico" sizes="any">
        <link rel="icon" href="icon.png" type="image/png">
        <script src="e-imzo.js"></script>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #f2f3f5;
                --surface: #ffffff;
                --border: #e1e4e8;
                --text: #1c2024;
                --muted: #6b7280;
                --accent: #2f6fed;
                --pill-bg: #eef2ff;
                --code-bg: #f6f8fa;
                --code-border: #e1e4e8;
                --tok-kw: #d73a49;
                --tok-obj: #6f42c1;
                --tok-fn: #005cc5;
                --tok-prop: #22863a;
                --tok-str: #032f62;
                --tok-comment: #6a737d;
                --tok-ident: #24292e;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #16181d;
                    --surface: #1e2126;
                    --border: #2c3038;
                    --text: #e8eaed;
                    --muted: #9aa1ac;
                    --accent: #7aa2ff;
                    --pill-bg: #262b3a;
                    --code-bg: #22262e;
                    --code-border: #2c3038;
                    --tok-kw: #c678dd;
                    --tok-obj: #61afef;
                    --tok-fn: #56b6c2;
                    --tok-prop: #e5c07b;
                    --tok-str: #98c379;
                    --tok-comment: #7f848e;
                    --tok-ident: #abb2bf;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                line-height: 1.55;
            }
            a {
                color: var(--accent);
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }
            .topbar {
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 20px 24px;
                background: var(--surface);
                border-bottom: 1px solid var(--border);
            }
            .topbar img {
                display: block;
                height: 30px;
                width: auto;
            }
            .topbar h1 {
                font-size: 1.05rem;
                font-weight: 600;
                margin: 0 0 4px;
            }
            .version {
                display: inline-block;
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 0.75rem;
                padding: 2px 10px;
                border-radius: 999px;
                background: var(--pill-bg);
                color: var(--accent);
            }
            .layout {
                display: grid;
                grid-template-columns: 240px minmax(0, 1fr);
                gap: 0;
                max-width: 1080px;
                margin: 0 auto;
                align-items: start;
            }
            .toc {
                position: sticky;
                top: 0;
                max-height: 100vh;
                overflow-y: auto;
                padding: 24px 16px;
            }
            .toc-title {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: var(--muted);
                margin: 0 0 10px;
            }
            .toc-list {
                list-style: none;
                margin: 0;
                padding: 0;
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 0.85rem;
            }
            .toc-list li {
                margin-bottom: 4px;
            }
            .toc-list a {
                color: var(--text);
                display: block;
                padding: 4px 8px;
                border-radius: 6px;
            }
            .toc-list a:hover {
                background: var(--pill-bg);
                text-decoration: none;
            }
            main {
                min-width: 0;
                padding: 24px 24px 64px;
            }
            .plugin {
                padding-top: 28px;
                margin-top: 28px;
                border-top: 1px solid var(--border);
            }
            .plugin:first-child {
                padding-top: 0;
                margin-top: 0;
                border-top: none;
            }
            .plugin h2 {
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 1.15rem;
                margin: 0 0 6px;
            }
            .plugin-desc {
                color: var(--muted);
                margin: 0 0 20px;
            }
            .func {
                margin: 0 0 24px;
                padding: 16px 18px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 10px;
            }
            .func-name {
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 0.95rem;
                margin: 0 0 6px;
            }
            .func-desc {
                margin: 0 0 12px;
                font-size: 0.92rem;
            }
            dl.args {
                margin: 0 0 14px;
                font-size: 0.85rem;
            }
            dl.args dt {
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-weight: 600;
                margin-top: 6px;
            }
            dl.args dd {
                margin: 2px 0 0 0;
                color: var(--muted);
            }
            .code-wrap {
                position: relative;
            }
            .code-block {
                margin: 0;
                padding: 14px 16px;
                background: var(--code-bg);
                border: 1px solid var(--code-border);
                border-radius: 8px;
                overflow-x: auto;
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 0.82rem;
            }
            .copy-btn {
                position: absolute;
                top: 8px;
                right: 8px;
                font: inherit;
                font-size: 0.72rem;
                padding: 4px 10px;
                border-radius: 6px;
                border: 1px solid var(--code-border);
                background: var(--surface);
                color: var(--muted);
                cursor: pointer;
            }
            .copy-btn:hover {
                color: var(--text);
            }
            .tok-kw { color: var(--tok-kw); }
            .tok-obj { color: var(--tok-obj); }
            .tok-fn { color: var(--tok-fn); }
            .tok-prop { color: var(--tok-prop); }
            .tok-str { color: var(--tok-str); }
            .tok-comment { color: var(--tok-comment); font-style: italic; }
            .tok-ident { color: var(--tok-ident); }
            .error {
                color: #d73a49;
            }
            @media (max-width: 760px) {
                .layout {
                    display: block;
                }
                .toc {
                    position: static;
                    max-height: none;
                }
            }
            .compat {
                /* Deliberately OUTSIDE <main id="content">: the script below empties that
                   element (`content.innerHTML = ''`) the moment the document loads, so
                   anything placed inside it disappears before a reader ever sees it.
                   Being outside means it also has to reproduce .layout's own centring
                   by hand — same 1080px cap, same auto margins — or it sits visibly
                   wider than everything under it. The width keeps a 16px gutter on a
                   narrow screen, where .layout's children get theirs from their own
                   padding and a bordered box would otherwise touch the edge. */
                width: calc(100% - 32px);
                max-width: 1080px;
                margin: 22px auto 0;
                background: var(--pill-bg);
                border: 1px solid var(--border);
                border-left: 3px solid var(--accent);
                border-radius: 10px;
                padding: 16px 20px;
            }
            .compat p {
                margin: 0;
            }
            .compat code {
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 0.9em;
            }
            .compat-note {
                margin-top: 10px !important;
                color: var(--muted);
                font-size: 0.92rem;
            }
        </style>
    </head>
    <!-- The script below builds nodes of its own, so its four strings ride in on
         data attributes rather than being interpolated into JavaScript: an attribute
         value cannot end a string literal or a <script> block, whoever writes the
         translation. They are read back through `document.body.dataset` in camelCase. -->
    <body data-copy="{{copy}}" data-copied="{{copied}}" data-optional="{{optional}}" data-load-failed="{{load_failed}}">
        <header class="topbar">
            <img src="openimzo-logo.png" alt="" width="40" height="40" style="border-radius:9px">
            <div>
                <h1>{{api_docs}}</h1>
                <span class="version">{{version}}</span>
            </div>
        </header>
        <div class="compat">
            <p><strong>{{compat_lead}}</strong> {{compat_body}}</p>
            <p class="compat-note">{{compat_note}}</p>
        </div>
        <div class="layout">
            <nav class="toc" aria-label="{{toc_title}}">
                <p class="toc-title">{{toc_title}}</p>
                <div id="tocList">{{loading}}</div>
            </nav>
            <main id="content">
                <p id="status">{{loading_doc}}</p>
            </main>
        </div>
        <script>
            (function () {
                var T = document.body.dataset;

                // Plugin, function and argument text arrives over the WebSocket in the language
                // the original wrote it in, because that reply is a wire contract this project
                // does not alter. This table turns it into the language the app is set to, on
                // the way to the screen. A string with no entry falls through unchanged, so a
                // missing translation shows the original's own words rather than a blank label.
                var DESCRIPTIONS = {{descriptions}};

                function tr(text) {
                    return (text && DESCRIPTIONS[text]) || text;
                }

                function el(tag, cls, text) {
                    var e = document.createElement(tag);
                    if (cls) e.className = cls;
                    if (text !== undefined) e.textContent = text;
                    return e;
                }

                function buildExampleCall(plugin, func) {
                    var code = el('code');
                    function tok(cls, text) { code.appendChild(el('span', 'tok-' + cls, text)); }
                    function raw(text) { code.appendChild(document.createTextNode(text)); }

                    tok('obj', 'CAPIWS'); raw('.'); tok('fn', 'callFunction'); raw('({\n');
                    raw('  '); tok('prop', 'plugin'); raw(': '); tok('str', '"' + plugin.name + '"'); raw(',\n');
                    raw('  '); tok('prop', 'name'); raw('   : '); tok('str', '"' + func.name + '"');

                    if (func.arguments && func.arguments.length) {
                        raw(',\n  '); tok('prop', 'arguments'); raw(': [\n');
                        func.arguments.forEach(function (arg, i) {
                            raw('    '); tok('comment', '// ' + tr(arg.description)); raw('\n    ');
                            tok('ident', arg.name);
                            raw(i < func.arguments.length - 1 ? ',\n' : '\n');
                        });
                        raw('  ]');
                    }

                    raw('\n},\n'); tok('kw', 'function'); raw('(event, data) {\n  ');
                    tok('obj', 'console'); raw('.'); tok('fn', 'log'); raw('(data);\n}, ');
                    tok('kw', 'function'); raw('(error) {\n  ');
                    tok('obj', 'window'); raw('.'); tok('fn', 'alert'); raw('(error);\n});');

                    var pre = el('pre', 'code-block');
                    pre.appendChild(code);

                    var copyBtn = el('button', 'copy-btn', T.copy);
                    copyBtn.type = 'button';
                    copyBtn.addEventListener('click', function () {
                        var text = code.textContent;
                        var done = function () {
                            copyBtn.textContent = T.copied;
                            setTimeout(function () { copyBtn.textContent = T.copy; }, 1500);
                        };
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            navigator.clipboard.writeText(text).then(done, done);
                        } else {
                            var ta = document.createElement('textarea');
                            ta.value = text;
                            ta.style.position = 'fixed';
                            ta.style.opacity = '0';
                            document.body.appendChild(ta);
                            ta.select();
                            try { document.execCommand('copy'); } catch (e) { /* clipboard unavailable */ }
                            document.body.removeChild(ta);
                            done();
                        }
                    });

                    var wrap = el('div', 'code-wrap');
                    wrap.appendChild(pre);
                    wrap.appendChild(copyBtn);
                    return wrap;
                }

                function renderDoc(plugins) {
                    var tocList = document.getElementById('tocList');
                    var content = document.getElementById('content');
                    tocList.innerHTML = '';
                    content.innerHTML = '';

                    var tocUl = el('ul', 'toc-list');

                    plugins.forEach(function (plugin) {
                        var tocLi = el('li');
                        var tocA = el('a', null, plugin.name);
                        tocA.href = '#plugin-' + plugin.name;
                        tocLi.appendChild(tocA);
                        tocUl.appendChild(tocLi);

                        var section = el('section', 'plugin');
                        section.id = 'plugin-' + plugin.name;
                        section.appendChild(el('h2', null, plugin.name));
                        section.appendChild(el('p', 'plugin-desc', tr(plugin.description)));

                        (plugin.functions || []).forEach(function (func) {
                            var fsec = el('article', 'func');
                            fsec.id = 'plugin-' + plugin.name + '-' + func.name;
                            fsec.appendChild(el('h3', 'func-name', func.name));
                            fsec.appendChild(el('p', 'func-desc', tr(func.description)));

                            if (func.arguments && func.arguments.length) {
                                var argsList = el('dl', 'args');
                                func.arguments.forEach(function (arg) {
                                    argsList.appendChild(el('dt', null, arg.name + (arg.optional ? ' (' + T.optional + ')' : '')));
                                    argsList.appendChild(el('dd', null, tr(arg.description)));
                                });
                                fsec.appendChild(argsList);
                            }

                            fsec.appendChild(buildExampleCall(plugin, func));
                            section.appendChild(fsec);
                        });

                        content.appendChild(section);
                    });

                    tocList.appendChild(tocUl);
                }

                function fail(reason) {
                    var content = document.getElementById('content');
                    content.innerHTML = '';
                    content.appendChild(el('p', 'error', T.loadFailed + ': ' + reason));
                }

                window.addEventListener('load', function () {
                    CAPIWS.apikey([
                        'localhost', '96D0C1491615C82B9A54D9989779DF825B690748224C2B04F500F370D51827CE2644D8D4A82C18184D73AB8530BB8ED537269603F61DB0D03D2104ABF789970B',
                        '127.0.0.1', 'A7BCFA5D490B351BE0754130DF03A068F855DB4333D43921125B9CF2670EF6A40370C646B90401955E1F7BC9CDBF59CE0B2C5467D820BE189C845D0B79CFC96F',
                        'null', 'E0A205EC4E7B78BBB56AFF83A733A1BB9FD39D562E67978CC5E7D73B0951DB1954595A20672A63332535E13CC6EC1E1FC8857BB09E0855D7E76E411B6FA16E9D'
                    ], function (event, data) {
                        if (data.success) {
                            CAPIWS.apidoc(function (event, data) {
                                renderDoc(data);
                            }, function (e) {
                                fail(e);
                            });
                        } else {
                            fail(data.reason);
                        }
                    }, function (e) {
                        fail(e);
                    });
                });
            })();
        </script>
    </body>
</html>
