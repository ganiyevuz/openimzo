<!DOCTYPE html>
<html lang="{{lang}}">
    <head>
        <meta charset="UTF-8">
        <title>OpenImzo — {{version}}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="favicon.ico" sizes="any">
        <link rel="icon" href="icon.png" type="image/png">
        <style>
            :root {
                color-scheme: light dark;
                --bg: #f2f3f5;
                --surface: #ffffff;
                --border: #e1e4e8;
                --text: #1c2024;
                --muted: #6b7280;
                --accent: #2f6fed;
                --pill-bg: #eef2ff;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #16181d;
                    --surface: #1e2126;
                    --border: #2c3038;
                    --text: #e8eaed;
                    --muted: #9aa1ac;
                    --accent: #7aa2ff;
                    --pill-bg: #262b3a;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 32px 20px;
                background: var(--bg);
                color: var(--text);
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                line-height: 1.55;
            }
            .card {
                width: 100%;
                max-width: 460px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 40px 32px;
                text-align: center;
            }
            .logo {
                display: inline-block;
                margin-bottom: 22px;
            }
            .logo {
                width: 72px;
                height: 72px;
                border-radius: 16px;
            }
            .links {
                display: flex;
                gap: 20px;
                justify-content: center;
                flex-wrap: wrap;
                font-size: 0.92rem;
            }
            h1 {
                font-size: 1.35rem;
                font-weight: 600;
                margin: 0 0 6px;
            }
            .tagline {
                color: var(--muted);
                margin: 0 0 22px;
                font-size: 0.95rem;
            }
            .version {
                display: inline-block;
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 0.8rem;
                padding: 4px 12px;
                border-radius: 999px;
                background: var(--pill-bg);
                color: var(--accent);
                margin-bottom: 22px;
            }
            .status {
                font-size: 0.95rem;
                margin: 0 0 26px;
            }
            hr {
                border: none;
                border-top: 1px solid var(--border);
                margin: 0 0 22px;
            }
            a {
                color: var(--accent);
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <img class="logo" src="openimzo-logo.png" alt="" width="72" height="72">
            <h1>OpenImzo</h1>
            <p class="tagline">{{tagline}}</p>
            <div class="version">{{version}}</div>
            <p class="status">{{status}}</p>
            <hr>
            <div class="links">
                <a href="apidoc.html">{{api_docs}}</a>
                <a href="https://github.com/ganiyevuz/openimzo">{{source_code}}</a>
            </div>
        </div>
    </body>
</html>
