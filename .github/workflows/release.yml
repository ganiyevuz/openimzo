# Builds the artifact a release is verified against, on infrastructure nobody here
# controls, with a log anyone can read end to end -- see docs/verifying-a-release.md,
# which this workflow exists to back up. It runs exactly one script,
# scripts/reproducible-build.sh, so that what happens here is what a reader following
# that script on their own machine also does; the value of this workflow is being
# boring and legible, not clever.
#
# Triggered by pushing a tag like v1.0.0. Also runnable by hand (workflow_dispatch) to
# check that a change to this file or to the build script still produces a clean build
# without having to cut a release to find out.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# The narrowest set that actually does the job: reading the repo, publishing a signed
# provenance attestation (needs id-token to mint it and attestations to store it), and
# attaching files to the GitHub release (contents: write).
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    # This project's macOS floor is 14 (macos/project.yml), and its pinned Xcode
    # (.xcode-version) is a version this runner label is expected to carry preinstalled
    # under /Applications/Xcode_<version>.app, GitHub's own convention for offering
    # multiple side-by-side Xcode versions on one image. If that version isn't on the
    # image yet, the "Select the pinned Xcode" step below fails loudly rather than
    # silently building with whatever the runner's default happens to be -- a silent
    # fallback would quietly break the promise this whole workflow exists to keep.
    runs-on: macos-15

    steps:
      - name: Check out the exact commit being released
        uses: actions/checkout@v5
        with:
          # scripts/reproducible-build.sh derives SOURCE_DATE_EPOCH from the commit's
          # own timestamp (`git log -1`), which a shallow checkout can still answer for
          # HEAD -- fetch-depth 0 isn't needed for that. It's fetched anyway so
          # `git describe`/tag lookups elsewhere in this job see real history rather
          # than a single detached commit.
          fetch-depth: 0

      # The pin must always name a RELEASED Xcode, never a beta. This step failed on
      # every tag until it did: .xcode-version named 27.0, which is a beta (build
      # 27A5237l) that exists on the author's machine and on no GitHub runner. A
      # reproducibility promise pinned to a beta is one nobody else can check, which
      # makes it not a promise. Same rule for every platform this ships on, and the
      # same reason rust-toolchain.toml names an exact stable release.
      - name: Select the pinned Xcode
        run: |
          set -euo pipefail
          version="$(cat .xcode-version)"
          app="/Applications/Xcode_${version}.app"
          if [ ! -d "$app" ]; then
            echo "::error::Xcode $version (.xcode-version) is not installed on this runner image ($app not found)." >&2
            echo "Available Xcode versions on this runner:" >&2
            ls /Applications | grep -i '^Xcode' >&2 || true
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          # `rustup show` reads rust-toolchain.toml on its own and installs the pinned
          # channel (and, per that file's own `targets` list, both Darwin targets) if
          # it isn't already present -- this just makes that happen as its own visible,
          # timed step rather than hiding inside the first build command.
          rustup show
          rustc --version
          cargo --version

      - name: Build the unsigned, reproducible artifact
        run: scripts/reproducible-build.sh dist

      - name: Publish the hash to the job summary
        run: |
          {
            echo "### OpenImzo unsigned build"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Rebuild and compare it yourself: see [docs/verifying-a-release.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/verifying-a-release.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      # A signed statement -- backed by GitHub's own OIDC identity for this exact
      # workflow run, not by anything this repository's maintainers assert -- of which
      # workflow, commit, and repository produced this file. Verifiable independently
      # with `gh attestation verify`; see docs/verifying-a-release.md.
      #
      # Skipped, visibly, while this repository is private: GitHub refuses to persist an
      # attestation for a user-owned private repository ("Feature not available for
      # user-owned private repositories"), which failed this whole job once. Gated on
      # the repository's own visibility rather than switched off or made
      # continue-on-error, so it comes back by itself the day the repository goes
      # public, and so a skipped step says plainly that it was skipped -- a provenance
      # step that silently swallowed its own failure would be worse than none.
      - name: Attach build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/OpenImzo-unsigned-macos.zip

      # Uploaded with the GitHub CLI, which is preinstalled on the runner, rather than
      # with a third-party release action. Same reason ci.yml runs no third-party
      # action at all: this project asks people to trust what it builds, and the step
      # that decides which bytes end up on the release page -- holding `contents:
      # write` while it does -- is the last place to run code from an author nobody
      # here has vetted.
      #
      # The signed convenience build (OpenImzo-signed-macos.zip) is not produced here:
      # it needs the maintainer's actual Apple Developer ID and notarization
      # credentials, which this workflow deliberately never has access to. It is built
      # and attached to the same release by hand, from the exact unsigned .app this job
      # already built and hashed -- see docs/verifying-a-release.md for what that means
      # for comparing the two.
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in dist/OpenImzo-unsigned-macos.zip dist/SHA256SUMS; do
            if [ ! -f "$file" ]; then
              echo "::error::$file was not produced by the build" >&2
              exit 1
            fi
          done

          # A tag whose name carries a suffix after a hyphen -- v2026.10.01-rc1 -- is a
          # pre-release and must never displace the stable one people download.
          case "$GITHUB_REF_NAME" in
            *-*) STABLE=false ;;
            *)   STABLE=true  ;;
          esac

          # Create the release if the tag has none yet, so pushing a tag is the whole
          # ceremony and nobody has to remember a manual step first.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OpenImzo ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              --prerelease="$( [ "$STABLE" = true ] && echo false || echo true )"
          fi

          gh release upload "$GITHUB_REF_NAME" \
            dist/OpenImzo-unsigned-macos.zip \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

          # Deleting a tag turns its release back into a draft, and a draft is invisible to
          # the /releases/latest endpoint -- which is what the app's own update check asks.
          # That happened twice while this repository was being set up, and each time the
          # in-app check silently went back to reporting no release at all. Stating both
          # flags on every run means a tag that has been moved comes back published rather
          # than staying quietly drafted.
          if [ "$STABLE" = true ]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi
